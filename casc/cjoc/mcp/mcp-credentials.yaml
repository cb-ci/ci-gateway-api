credentials:
  system:
    domainCredentials:
      - credentials:
          # confidential client the router uses for token exchange (the chart gives it a projected service account token)
          - jenkinsOAuthClient:
              id: "cloudbees-mcp-router"
              description: "CloudBees CI MCP Router"
              scope: SYSTEM
              grantTokenExchange: true
              tokenEndpointAuthMethod: CLIENT_SECRET_BASIC
              allowedAudiences:
                - "${mcp_aud_cjoc}"
                - "${mcp_aud_controller1}"
                - "${mcp_aud_controller2}"
                - "${mcp_aud_controller3}"
                - "${mcp_aud_folder_dev1_controller1}"
                - "${mcp_aud_folder_dev1_controller2}"
                - "${mcp_aud_hahs}"
                - "${mcp_aud_plugins_casc_uc}"
                - "${mcp_aud_plugable_storage}"
                - "${mcp_aud_testnodegroup}"
                - "${mcp_aud_workshop}"
          # public PKCE client MCP agents (Claude Code: --client-id ci-mcp-client) sign in with; no token exchange,
          # so it carries no allowedAudiences of its own
          - jenkinsOAuthClient:
              id: "ci-mcp-client"
              description: "CloudBees CI MCP Public Client"
              scope: SYSTEM
              grantAuthorizationCode: true
              grantRefreshToken: true
              pkceRequired: true
              tokenEndpointAuthMethod: NONE              
              audience: "https://${GATEWAY_DOMAIN}/mcp-router"
              redirectUrisRaw: |-
                http://127.0.0.1/callback
                http://[::1]/callback
                http://localhost/callback
        domain: {}